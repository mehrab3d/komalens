name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java executable could not be found."
            exit 1
          fi
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*"([0-9]+)(\.[0-9]+.*)?".*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect Java major version from: $JAVA_VER_OUTPUT"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than required Java 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Temporary debug keystore (./debug.keystore) could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have a .apk extension."
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Unexpected APK path: $EXPECTED_APK"
            exit 1
          fi
          echo "Verified debug APK at $EXPECTED_APK"
          echo "apk_built=true" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          PREPARED_APK="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$PREPARED_APK"
          if [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Failed to prepare app-debug.apk in temporary directory."
            exit 1
          fi
          echo "release_apk_path=${PREPARED_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          PREPARED_APK="${{ steps.prepare_release_asset.outputs.release_apk_path }}"
          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Prepared APK does not exist or is empty."
            exit 1
          fi

          ASSET_FILENAME=$(basename "$PREPARED_APK")
          case "$ASSET_FILENAME" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset does not end in .apk."
              exit 1
              ;;
          esac
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk, got: $ASSET_FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          - Automatically generated debug APK.
          - Built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Intended for testing only.
          - Not a Google Play Store production release.
          - Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup GitHub Actions artifact 'app-debug-apk' also remains available."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Publishing to GitHub Releases did not succeed."
            if [ "${{ steps.verify_apk.outputs.apk_built }}" = "true" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            fi
            {
              echo "### WARNING: GitHub Release Publishing Failed"
              if [ "${{ steps.verify_apk.outputs.apk_built }}" = "true" ]; then
                echo "- The debug APK build succeeded."
                echo "- The GitHub Actions backup artifact \`app-debug-apk\` remains available for download."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
